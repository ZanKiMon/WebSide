<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kimoe Han 的个人作品集 — 网络工程 · 中国广东" />
    <title>Kimoe Han · 个人作品集</title>
    <!-- 提前设置深色背景，避免页面加载时白屏闪烁 -->
    <style>
      html {
        background-color: #090a0c;
      }
    </style>
    <!-- React 加载前预设语言，避免首帧 lang/标题闪错（与 src/i18n/index.jsx 同一套逻辑） -->
    <script>
      ;(function () {
        var langs = ['zh', 'ja', 'ko', 'en']
        var lang = 'zh'
        try {
          var saved = localStorage.getItem('kimoe-lang')
          if (langs.indexOf(saved) !== -1) {
            lang = saved
          } else {
            var b = (navigator.language || 'zh').toLowerCase()
            lang = b.indexOf('zh') === 0 ? 'zh' : b.indexOf('ja') === 0 ? 'ja' : b.indexOf('ko') === 0 ? 'ko' : 'en'
          }
        } catch (e) {}
        var titles = {
          zh: 'Kimoe Han · 个人作品集',
          ja: 'Kimoe Han · ポートフォリオ',
          ko: 'Kimoe Han · 포트폴리오',
          en: 'Kimoe Han · Portfolio',
        }
        var htmlLangs = { zh: 'zh-CN', ja: 'ja', ko: 'ko', en: 'en' }
        document.documentElement.lang = htmlLangs[lang]
        document.title = titles[lang]
      })()
    </script>
    <!-- React 加载前预设主题，避免深色/浅色闪屏（与 src/i18n/index.jsx 同一套逻辑） -->
    <script>
      ;(function () {
        var theme = 'ink'
        try {
          var s = localStorage.getItem('kimoe-theme')
          if (s === 'moe' || s === 'ink' || s === 'p5') theme = s
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'moe') {
          document.documentElement.style.backgroundColor = '#fafcff'
        } else if (theme === 'p5') {
          document.documentElement.style.backgroundColor = '#0b0a0b'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
